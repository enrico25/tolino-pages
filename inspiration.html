<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tolino Inspiration</title>
<style>
  /* E-Ink: Schwarz/Weiß + Graustufenfotos, große Schrift, keine weichen Animationen */
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  /* Alles muss auf einen Tolino-Bildschirm passen (6 Zoll, ohne Scrollen) -> Größen in vmin */
  body { font-family: Georgia, "Times New Roman", serif; padding: 2.5vmin 4vmin; }
  .top { font-family: Helvetica, Arial, sans-serif; font-size: 2.4vmin; letter-spacing: 0.15em; text-transform: uppercase; font-weight: bold; border-bottom: 0.4vmin solid #000; padding-bottom: 1vmin; }
  .top span { float: right; letter-spacing: 0; }
  h1 { font-size: 6.4vmin; margin: 1.6vmin 0 0; line-height: 1.05; }
  .project { font-size: 3.3vmin; margin-top: 0.4vmin; font-style: italic; }
  .row { margin-top: 2vmin; overflow: hidden; }
  .left { float: left; width: 44%; margin-right: 3vmin; }
  .pic { text-align: center; }
  .pic img { max-width: 100%; max-height: 34vh; display: inline-block; }
  .pic canvas { image-rendering: pixelated; image-rendering: -webkit-optimize-contrast; display: block; }
  .credit { font-family: Helvetica, Arial, sans-serif; font-size: 1.9vmin; margin-top: 0.5vmin; text-align: center; }
  .desc { font-size: 3vmin; line-height: 1.3; }
  .quote { font-size: 4.2vmin; line-height: 1.25; font-weight: bold; margin-top: 2vmin; border-top: 0.4vmin solid #000; padding-top: 1.8vmin; }
  .trans { font-size: 3.1vmin; line-height: 1.3; font-style: italic; margin-top: 1vmin; }
  .source { font-size: 2.5vmin; margin-top: 1vmin; }
  .bar { font-family: Helvetica, Arial, sans-serif; margin-top: 2vmin; border-top: 0.4vmin solid #000; padding-top: 1.8vmin; white-space: nowrap; }
  .btn { display: inline-block; border: 0.35vmin solid #000; padding: 1.2vmin 2.4vmin; margin: 0 1vmin 0 0; text-decoration: none; color: #000; font-size: 3.2vmin; }
  .btn.small { font-size: 2.6vmin; padding: 1.2vmin 1.6vmin; border-width: 0.25vmin; }
</style>
</head>
<body>
  <div class="top">Inspiration <span id="count"></span></div>
  <h1 id="who"></h1>
  <div class="project" id="project"></div>
  <div class="row">
    <div class="left"><div class="pic" id="pic"></div><div class="credit" id="credit"></div></div>
    <div class="desc" id="desc"></div>
  </div>
  <div class="quote" id="quote"></div>
  <div class="trans" id="trans"></div>
  <div class="source" id="source"></div>

  <div class="bar">
    <a class="btn" href="#" id="prev">‹</a><a class="btn" href="#" id="next">Weiter ›</a><a class="btn" href="#" id="rand">Zufall</a><a class="btn small" href="index.html">Dashboard</a><a class="btn small" href="tiere.html">Tiere</a>
  </div>

<script>
// ===================== Pixel-Art (eigene Zeichnungen) =====================
// Jede Funktion liefert für Bild-Nr. f ein Array aus Zeilen: "#" = schwarz.
function blank(w, h){ var r = []; for (var y = 0; y < h; y++) { var s = ""; for (var x = 0; x < w; x++) s += "."; r.push(s); } return r; }
function put(g, x, y){ if (y >= 0 && y < g.length && x >= 0 && x < g[0].length) g[y] = g[y].substring(0, x) + "#" + g[y].substring(x + 1); }
function line(g, x0, y0, x1, y1){
  var dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, e = dx + dy;
  for (;;) { put(g, x0, y0); if (x0 === x1 && y0 === y1) break; var e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function rect(g, x0, y0, x1, y1){ line(g, x0, y0, x1, y0); line(g, x1, y0, x1, y1); line(g, x1, y1, x0, y1); line(g, x0, y1, x0, y0); }

// Steve Jobs: Macintosh mit blinkendem Cursor, Text erscheint Stück für Stück
function macintosh(f){
  var g = blank(26, 26);
  rect(g, 2, 0, 23, 21); rect(g, 3, 1, 22, 20);           // Gehäuse
  rect(g, 5, 2, 20, 13);                                   // Bildschirm
  line(g, 13, 17, 19, 17);                                 // Diskettenschlitz
  line(g, 4, 22, 21, 22); line(g, 4, 22, 4, 24); line(g, 21, 22, 21, 24); line(g, 4, 24, 21, 24); // Fuß
  put(g, 7, 4); put(g, 8, 5); put(g, 7, 6);               // Eingabezeichen ">"
  var words = [[7, 9, 5], [13, 9, 4], [7, 11, 3], [11, 11, 6]]; // Textzeilen: x, y, Länge
  var shown = f % 6;
  for (var i = 0; i < words.length && i < shown; i++) line(g, words[i][0], words[i][1], words[i][0] + words[i][2] - 1, words[i][1]);
  if (f % 2 === 0) line(g, 10, 6, 12, 6);                 // Cursor blinkt
  return g;
}

// Ada Lovelace: Lochkarte, deren Muster sich wie beim Webstuhl verschiebt
function punchcard(f){
  var g = blank(30, 16);
  line(g, 3, 0, 29, 0); line(g, 29, 0, 29, 15); line(g, 29, 15, 0, 15); line(g, 0, 15, 0, 3); line(g, 0, 3, 3, 0); // Karte mit schräger Ecke
  for (var r = 0; r < 5; r++)
    for (var c = 0; c < 12; c++) {
      var on = ((c + f) * 7 + r * 3 + ((c + f) * r)) % 5 < 2; // "Algebraisches Muster"
      var x = 3 + c * 2, y = 3 + r * 2;
      if (on) { put(g, x, y); put(g, x + 1, y); put(g, x, y + 1); put(g, x + 1, y + 1); }
      else put(g, x, y + 1);
    }
  return g;
}

// Richard Feynman: Feynman-Diagramm, das Photon schlängelt sich
function feynman(f){
  var g = blank(36, 18);
  line(g, 1, 1, 9, 9); line(g, 1, 17, 9, 9);              // Elektron + Positron rein
  line(g, 26, 9, 34, 1); line(g, 26, 9, 34, 17);          // Paar raus
  put(g, 4, 3); put(g, 5, 3); put(g, 5, 4);               // Pfeilspitzen
  put(g, 30, 4); put(g, 30, 5); put(g, 31, 5);
  var py = null;                                            // Photon als durchgehende Welle
  for (var x = 9; x <= 26; x++) {
    var y = (x === 9 || x === 26) ? 9 : 9 + Math.round(2 * Math.sin((x + f) * Math.PI / 3));
    if (py === null) put(g, x, y); else line(g, x - 1, py, x, y);
    py = y;
  }
  return g;
}

// Dieter Rams: schlichtes Radio – Lautsprecherraster + Drehregler, der sich dreht
function radio(f){
  var g = blank(34, 18);
  rect(g, 0, 0, 33, 17); rect(g, 1, 1, 32, 16);
  for (var y = 4; y <= 13; y += 2) for (var x = 4; x <= 16; x += 2) put(g, x, y); // Lochraster
  var cx = 25, cy = 8, R = 5;
  for (var a = 0; a < 32; a++) put(g, Math.round(cx + R * Math.cos(a * Math.PI / 16)), Math.round(cy + R * Math.sin(a * Math.PI / 16)));
  var ang = f * Math.PI / 4;                                // Zeiger dreht sich
  line(g, cx, cy, Math.round(cx + (R - 2) * Math.cos(ang)), Math.round(cy + (R - 2) * Math.sin(ang)));
  put(g, cx, cy);
  return g;
}

// ===================== Inhalte (Zitate mit geprüfter Quelle) =====================
var PEOPLE = [
  { who: "Elon Musk", project: "SpaceX · wiederverwendbare Raketen",
    img: "img/musk.png", credit: "Foto: SpaceX, CC0",
    desc: "Falcon 9 beim Start der Mission ORBCOMM-2 am 21. Dezember 2015. Minuten später landete die erste Stufe wieder auf festem Boden – als erste Orbitalrakete überhaupt.",
    quote: "When something is important enough, you do it even if the odds are not in your favor.",
    trans: "Wenn etwas wichtig genug ist, tut man es – selbst wenn die Chancen nicht für einen stehen.",
    source: "Interview mit „60 Minutes“ (CBS), 2012" },
  { who: "Steve Jobs", project: "Apple · Macintosh (1984)",
    pixel: macintosh, credit: "Pixel-Zeichnung",
    desc: "Der Macintosh brachte die grafische Oberfläche mit Fenstern und Maus zu ganz normalen Menschen – nicht nur zu Ingenieuren.",
    quote: "Your time is limited, so don’t waste it living someone else’s life.",
    trans: "Deine Zeit ist begrenzt, also verschwende sie nicht damit, das Leben eines anderen zu leben.",
    source: "Rede an der Stanford University, 2005" },
  { who: "Wilbur & Orville Wright", project: "Der erste Motorflug (1903)",
    img: "img/wright.png", credit: "Foto: John T. Daniels, gemeinfrei",
    desc: "17. Dezember 1903, Kitty Hawk: Orville fliegt 12 Sekunden und 37 Meter weit, Wilbur läuft nebenher. Zwei Fahrradmechaniker schlagen die Experten.",
    quote: "For some years I have been afflicted with the belief that flight is possible to man.",
    trans: "Seit einigen Jahren plagt mich der Glaube, dass der Mensch fliegen kann.",
    source: "Wilbur Wright, Brief an Octave Chanute, 13. Mai 1900" },
  { who: "Ada Lovelace", project: "Das erste Computerprogramm (1843)",
    pixel: punchcard, credit: "Pixel-Zeichnung",
    desc: "Für Babbages nie gebaute Analytische Maschine schrieb sie den ersten veröffentlichten Algorithmus – und ahnte, dass Rechenmaschinen mehr können als rechnen.",
    quote: "The Analytical Engine weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves.",
    trans: "Die Analytische Maschine webt algebraische Muster, so wie der Jacquard-Webstuhl Blumen und Blätter webt.",
    source: "Note A zu ihrer Übersetzung von Menabreas Aufsatz, 1843" },
  { who: "Marie Curie", project: "Radioaktivität · zwei Nobelpreise",
    img: "img/curie.png", credit: "Foto: Henri Manuel, um 1920, gemeinfrei",
    desc: "Sie entdeckte Polonium und Radium und erhielt als erster Mensch zwei Nobelpreise – 1903 für Physik und 1911 für Chemie.",
    quote: "But we must not forget that when radium was discovered no one knew that it would prove useful in hospitals.",
    trans: "Aber wir dürfen nicht vergessen: Als das Radium entdeckt wurde, wusste niemand, dass es einmal in Krankenhäusern nützlich sein würde.",
    source: "Vortrag „The Discovery of Radium“, Vassar College, 1921" },
  { who: "Apollo 11", project: "Die Mondlandung (1969)",
    img: "img/apollo.png", credit: "Foto: NASA / Neil Armstrong, gemeinfrei",
    desc: "Buzz Aldrin auf dem Mond, fotografiert von Neil Armstrong am 20. Juli 1969 – keine sieben Jahre nach Kennedys Rede.",
    quote: "We choose to go to the Moon in this decade and do the other things, not because they are easy, but because they are hard.",
    trans: "Wir haben uns entschieden, in diesem Jahrzehnt zum Mond zu fliegen und die anderen Dinge zu tun – nicht, weil sie leicht sind, sondern weil sie schwer sind.",
    source: "John F. Kennedy, Rede an der Rice University, 12. September 1962" },
  { who: "Richard Feynman", project: "Quantenphysik · Challenger-Aufklärung",
    pixel: feynman, credit: "Pixel-Zeichnung: Feynman-Diagramm",
    desc: "Seine Diagramme machen Teilchenphysik zeichenbar. 1986 zeigte er mit einem Glas Eiswasser, warum die Dichtungsringe der Challenger versagten.",
    quote: "For a successful technology, reality must take precedence over public relations, for nature cannot be fooled.",
    trans: "Damit eine Technologie erfolgreich ist, muss die Wirklichkeit Vorrang vor der Öffentlichkeitsarbeit haben – denn die Natur lässt sich nicht täuschen.",
    source: "Anhang F zum Bericht der Challenger-Kommission, 1986" },
  { who: "Dieter Rams", project: "Design für Braun",
    pixel: radio, credit: "Pixel-Zeichnung",
    desc: "Jahrzehntelang gestaltete er die Geräte von Braun. Seine zehn Thesen für gutes Design prägen bis heute ganze Branchen – auch Apple.",
    quote: "Weniger, aber besser.",
    trans: "",
    source: "Leitsatz von Dieter Rams und Titel seines Buches, 1995" }
];

// ===================== Anzeige =====================
function $(id){ return document.getElementById(id); }
var cur = 0, frame = 0, timer = null, canvas = null, ctx = null, px = 1;

function drawPixel(){
  var p = PEOPLE[cur], g = p.pixel(frame);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#000";
  for (var y = 0; y < g.length; y++) for (var x = 0; x < g[y].length; x++) if (g[y].charAt(x) === "#") ctx.fillRect(x * px, y * px, px, px);
}

function show(i){
  cur = (i + PEOPLE.length) % PEOPLE.length;
  var p = PEOPLE[cur];
  clearTimeout(timer); frame = 0;
  $("count").textContent = (cur + 1) + " / " + PEOPLE.length;
  $("who").textContent = p.who;
  $("project").textContent = p.project;
  $("credit").textContent = p.credit;
  $("desc").textContent = p.desc;
  $("quote").textContent = "„" + p.quote + "“";
  $("trans").textContent = p.trans;
  $("trans").style.display = p.trans ? "block" : "none";
  $("source").textContent = "— " + p.source;
  var pic = $("pic"); pic.innerHTML = "";
  if (p.img) {
    var im = document.createElement("img"); im.src = p.img; im.alt = p.project; pic.appendChild(im);
  } else {
    canvas = document.createElement("canvas"); pic.appendChild(canvas);
    var g0 = p.pixel(0), w = g0[0].length, h = g0.length;
    var maxH = window.innerHeight * 0.30;
    px = Math.max(2, Math.floor(Math.min(pic.clientWidth / w, maxH / h)));
    canvas.width = w * px; canvas.height = h * px;
    canvas.style.width = (w * px) + "px"; canvas.style.margin = "0 auto";
    ctx = canvas.getContext("2d");
    (function loop(){ drawPixel(); frame++; timer = setTimeout(loop, 1000); })(); // 1 Bild/s – E-Ink-freundlich
  }
  try { localStorage.setItem("insp", cur); } catch (e) {}
}

$("next").onclick = function(e){ e.preventDefault(); show(cur + 1); };
$("prev").onclick = function(e){ e.preventDefault(); show(cur - 1); };
$("rand").onclick = function(e){ e.preventDefault(); var n = cur; while (n === cur && PEOPLE.length > 1) n = Math.floor(Math.random() * PEOPLE.length); show(n); };

// Start: jeden Tag eine andere Person (oder die zuletzt angesehene, wenn sie heute gewählt wurde)
var d = new Date(), today = d.getFullYear() * 1000 + d.getMonth() * 40 + d.getDate();
var start = today % PEOPLE.length;
try { if (+localStorage.getItem("insp_day") === today && localStorage.getItem("insp") !== null) start = +localStorage.getItem("insp"); localStorage.setItem("insp_day", today); } catch (e) {}
show(start);
</script>
</body>
</html>
